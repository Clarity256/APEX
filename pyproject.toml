[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-resource-alloc"
version = "0.1.0"
description = "Dual-timescale fair downlink resource allocation for LEO direct-access networks."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<1.17",
    "pandas>=2.2,<2.4",
    "pyyaml>=6.0,<7.0",
    "matplotlib>=3.9,<3.11",
    "tqdm>=4.66,<5.0",
    "rich>=13.7,<15.0",
    "skyfield>=1.49,<2.0",
    "sgp4>=2.23,<3.0",
]

[project.optional-dependencies]
solvers = [
    "cvxpy>=1.6,<1.8",
    "ecos>=2.0,<3.0",
    "clarabel>=0.10,<1.0",
]
commercial-solvers = [
    "gurobipy>=12.0,<13.0",
    "Mosek>=11.0,<12.0",
]
rl = [
    "gymnasium>=1.0,<1.3",
    "stable-baselines3>=2.5,<3.0",
    "sb3-contrib>=2.5,<3.0",
    "torch>=2.9,<2.10",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<0.14",
    "mypy>=1.13,<1.19",
    "types-PyYAML>=6.0,<7.0",
]
notebook = [
    "jupyter>=1.1,<2.0",
    "ipykernel>=6.29,<7.0",
    "seaborn>=0.13,<0.14",
]
all-open = [
    "leo-resource-alloc[solvers,rl,dev,notebook]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = [
    # Physical-unit suffixes such as freq_Hz and G_tx_dBi are intentional.
    "N815",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
packages = ["leo_alloc"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "cvxpy.*",
    "gurobipy.*",
    "mosek.*",
    "skyfield.*",
    "sgp4.*",
    "stable_baselines3.*",
    "sb3_contrib.*",
]
ignore_missing_imports = true
